name: Build ImmortalWrt 25.12.2 for RAX3000H

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-immortalwrt.yml'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  OPENWRT_DIR: deps/openwrt
  RELEASE_TAG: 25.12.2-rax3000h

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl patch perl xz-utils zstd bzip2 \
            pkg-config ca-certificates
          python3 --version

      - name: Restore source download cache
        uses: actions/cache@v4
        with:
          path: deps/openwrt/dl
          key: openwrt-dl-${{ hashFiles('tools/openwrt/sources.lock.json') }}
          restore-keys: |
            openwrt-dl-

      - name: Prepare pinned sources
        run: |
          set -o pipefail
          python3 tools/prepare_build.py --jobs "$(nproc)" 2>&1 | tee /tmp/prepare.log

      - name: Compile userspace
        run: |
          python3 tools/build_openwrt.py --jobs 4

      - name: Assemble firmware image
        run: |
          python3 tools/build_openwrt_firmware.py

      - name: Assemble installer
        run: |
          python3 tools/build_installer.py

      - name: Package release
        run: |
          python3 tools/package_release.py
          ls -lh dist/release
          test -s dist/release/immortalwrt-rootfs.ubi
          test -s dist/release/installer.cpio.gz
          test -s dist/release/rax3000h-flasher.zip
          python3 - <<'PY'
          from pathlib import Path
          image = Path('dist/release/immortalwrt-rootfs.ubi')
          data = image.read_bytes()
          assert data[:4] == b'UBI#', data[:4]
          assert len(data) <= 27 * 1024 * 1024, len(data)
          print(f'rootfs UBI OK: {len(data)} bytes')
          PY

      - name: Summarize failure
        if: failure()
        run: |
          mkdir -p deps/logs
          cp /tmp/prepare.log deps/logs/prepare.log 2>/dev/null || true
          {
            echo '### Build failure'
            for log in deps/logs/*.log; do
              [ -f "$log" ] || continue
              echo "#### $log"
              tail -n 80 "$log"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(grep -HinE 'error|failed|fatal|undefined reference|no rule|no such file|not found' deps/logs/*.log |
            tail -n 12 | tr '\n' ' ' | cut -c1-900)
          [ -n "$msg" ] || msg=$(tail -n 10 /tmp/prepare.log 2>/dev/null | tr '\n' ' ' | cut -c1-900)
          [ -n "$msg" ] && echo "::error title=Build failure::$msg"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: deps/logs
          if-no-files-found: ignore

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rax3000h-immortalwrt-25.12.2
          path: dist/release/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --title "ImmortalWrt 25.12.2 RAX3000H" \
            --notes "ImmortalWrt 25.12.2 userspace for RAX3000H. Default LuCI theme: 7Dollar. No third-party plugins besides the theme."
